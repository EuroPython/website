services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "run", "dev", "--host", "0.0.0.0"]
    ports:
      - "4321:4321"
    environment:
      - ASTRO_TELEMETRY_DISABLED=1
    volumes:
      - .:/app            
      - node_modules:/app/node_modules  

volumes:
  node_modules:
