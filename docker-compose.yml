services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "src/serve.py", "--port", "4321", "--host", "0.0.0.0"]
    env_file:
      - .env.development
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - venv:/app/.venv
      - uv-cache:/root/.cache/uv

volumes:
  venv:
  uv-cache:
