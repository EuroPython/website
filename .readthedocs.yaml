# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

  commands:
    - pip install uv
    - uv sync
    - SITE_URL=$READTHEDOCS_CANONICAL_URL uv run src/build.py --all
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cd build && cp -r * $READTHEDOCS_OUTPUT/html
