version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      react-dependencies:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
